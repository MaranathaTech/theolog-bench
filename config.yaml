# Group descriptions for detailed reports
group_descriptions:
  frontier: "Frontier cloud models representing the highest-capability LLMs available via API. These are proprietary models with no local inference option, costing >$1.50 per benchmark run."
  local-70b: "Open-weight models in the 70B+ parameter tier that fit on a single 96GB GPU (e.g., NVIDIA RTX PRO 6000 Blackwell) at Q4 quantization."
  local-24gb: "Open-weight models that fit on a consumer GPU with 24GB VRAM (RTX 3090/4090/5090) at Q4 quantization."
  budget: "The cheapest cloud API models, each costing less than $0.15 per benchmark run. Good for high-volume or cost-sensitive deployments."
  mid: "Mid-tier cloud models balancing cost and capability, ranging from $0.08 to $0.50 per benchmark run."
  local: "Models runnable locally via Ollama or Unsloth with no API cost. Includes fine-tuned and base models for direct comparison."
  cloud: "All cloud-hosted models across budget, mid-tier, and frontier tiers."
  all: "Every model in the benchmark suite — local and cloud."
  finetune-compare: "Direct comparison of the fine-tuned Reformed Qwen3-1.7B against its base model."
  smoke: "Minimal smoke test set using the cheapest available model."

# Named groups of presets for batch testing
# Use with: python run.py --group <name>
groups:
  # Quick local test — just your models, no API needed
  local:
    - finetuned
    - base-qwen3-1.7b
    - qwen3-4b
    - gemma4-e4b
    - qwen3-8b-local
    - gemma4-26b
    - deepseek-r1-8b

  # Cheapest cloud models — verify OpenRouter works, <$0.25 total
  budget:
    - llama-4-scout
    - deepseek-v4-flash
    - llama-4-maverick
    - grok-4-fast

  # Mid-tier — good balance of cost and capability, ~$1.50 total
  mid:
    - deepseek-v4-pro
    - qwen3.6-35b
    - mistral-large-3
    - gpt-4.1-mini
    - gemini-2.5-flash

  # Frontier — the big guns, ~$15 total
  frontier:
    - gemini-3.1-pro
    - grok-4
    - claude-sonnet-4.6
    - claude-opus-4.7
    - gpt-5.5

  # All cloud models (no local)
  cloud:
    - llama-4-scout
    - deepseek-v4-flash
    - llama-4-maverick
    - grok-4-fast
    - deepseek-v4-pro
    - qwen3.6-35b
    - mistral-large-3
    - gpt-4.1-mini
    - gemini-2.5-flash
    - gemini-3.1-pro
    - grok-4
    - claude-sonnet-4.6
    - claude-opus-4.7
    - gpt-5.5

  # Everything — local + cloud
  all:
    - finetuned
    - base-qwen3-1.7b
    - qwen3-4b
    - gemma4-e2b
    - gemma4-e4b
    - qwen3-8b-local
    - gemma4-26b
    - deepseek-r1-8b
    - llama-4-scout
    - deepseek-v4-flash
    - llama-4-maverick
    - grok-4-fast
    - deepseek-v4-pro
    - qwen3.6-35b
    - mistral-large-3
    - gpt-4.1-mini
    - gemini-2.5-flash
    - gemini-3.1-pro
    - grok-4
    - claude-sonnet-4.6
    - claude-opus-4.7
    - gpt-5.5

  # 70B-tier local models — fits on a single 96GB GPU
  # 70B-tier open models — all fit on a single 96GB GPU
  local-70b:
    - llama-3.3-70b
    - deepseek-r1-70b
    - qwen3.5-122b

  # 24GB-tier open models — fit on RTX 3090/4090/5090
  local-24gb:
    - gemma4-31b
    - gemma4-26b-a4b
    - gemma3-27b
    - mistral-small-3.2
    - qwen3.6-27b
    - qwen3.5-27b
    - qwen3.6-35b
    - phi-4
    - qwen3.5-9b

  # Fine-tuned vs base comparison (the most common use case)
  finetune-compare:
    - finetuned
    - base-qwen3-1.7b

  # Smoke test set — cheapest possible
  smoke:
    - deepseek-v4-flash
    - llama-4-scout
