# Group descriptions for detailed reports
group_descriptions:
  12gb: "Open-weight models that fit on 12GB VRAM (RTX 3060/4060) at Q4 quantization — up to ~14B dense parameters. Run via OpenRouter, ~$0.10 total."
  24gb: "Open-weight models that fit on 24GB VRAM (RTX 3090/4090/5090) at Q4 quantization — 24B-35B parameters. Run via OpenRouter, ~$0.50 total."
  48gb: "Open-weight models that fit on 48GB VRAM (A6000/dual-GPU) at Q4 quantization — 70B dense parameters. Run via OpenRouter, ~$0.20 total."
  96gb: "Open-weight models that fit on 96GB VRAM (RTX PRO 6000 Blackwell / A100 80GB) at Q4 quantization — 70B-128B parameters. Run via OpenRouter, ~$1.00 total."
  frontier: "Frontier cloud models — the most capable (and expensive) LLMs available via API, costing >$0.50 per benchmark run. Run via OpenRouter, ~$17 total."
  budget: "The cheapest cloud API models, each costing less than $0.15 per benchmark run. Run via OpenRouter, ~$0.40 total."
  mid: "Mid-tier cloud models balancing cost and capability, ranging from $0.08 to $0.55 per benchmark run. Run via OpenRouter, ~$2.00 total."
  local: "Models runnable locally via Ollama or Unsloth with no API cost. Includes fine-tuned and base models for direct comparison."
  cloud: "All cloud-hosted models across budget, mid-tier, and frontier tiers. Run via OpenRouter."
  all: "Every model in the benchmark suite — all tiers. Run via OpenRouter (except local-only Ollama presets)."
  finetune-compare: "Direct comparison of the fine-tuned Reformed Qwen3-1.7B against its base model."
  smoke: "Minimal smoke test set using the cheapest available model."

# Named groups of presets for batch testing
# Use with: python run.py --group <name>
groups:
  # 12GB VRAM tier — RTX 3060/4060 (up to ~14B dense, via OpenRouter, ~$0.10)
  12gb:
    - qwen3.5-9b              # 9B dense, ~6GB Q4, ~$0.02/run
    - phi-4                   # 14B dense, ~9GB Q4, ~$0.02/run
    - gemma4-26b-a4b          # 26B MoE (4B active), ~15GB Q4 but fits 12GB in MoE mode via API, ~$0.01/run

  # 24GB VRAM tier — RTX 3090/4090/5090 (24B-35B, via OpenRouter, ~$0.50)
  24gb:
    - mistral-small-3.2       # 24B dense, ~14GB Q4, ~$0.02/run
    - gemma3-27b              # 27B dense, ~16GB Q4, ~$0.01/run
    - qwen3.6-27b             # 27B dense, ~16GB Q4, ~$0.10/run
    - qwen3.5-27b             # 27B dense, ~16GB Q4, ~$0.06/run
    - gemma4-31b              # 31B dense, ~18GB Q4, ~$0.03/run
    - glm-4-32b               # 32B dense, ~18GB Q4, ~$0.01/run
    - qwen3.6-35b             # 35B MoE (3B active), ~20GB Q4, ~$0.16/run

  # 48GB VRAM tier — A6000 / dual-GPU (70B dense, via OpenRouter, ~$0.20)
  48gb:
    - llama-3.3-70b           # 70B dense, ~40GB Q4, ~$0.03/run
    - deepseek-r1-70b         # 70B dense (R1 distill), ~40GB Q4, ~$0.10/run

  # 96GB VRAM tier — RTX PRO 6000 / A100 (100B+, via OpenRouter, ~$1.00)
  96gb:
    - qwen3.5-122b            # 122B MoE (10B active), ~70GB Q4, ~$0.30/run
    - mistral-medium-3.5      # 128B dense, ~70GB Q4, ~$0.60/run

