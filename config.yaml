    api_url: http://localhost:11434/v1
    model: qwen3:4b
    description: "Qwen3 4B (Ollama)"
    meta:
      vendor: "Qwen"
      architecture: "4B dense"
      params: "4B"
      local_capable: true

  gemma4-e2b:
    backend: api
    api_url: http://localhost:11434/v1
    model: gemma4:e2b
    description: "Gemma 4 E2B — 2.3B effective (Ollama)"
